function buildMenu(){

}
function fold(i){document.querySelector(`[data-g="${i}"]`).classList.toggle('fold')}
function go(id){current=id;buildMenu();document.getElementById('crumb').textContent=names[id];render();document.querySelector('.content').scrollTop=0}
function setTab(key,val){state.tabs[key]=val;render()}
function getTab(key,def){return state.tabs[key]||def}
function tabs(key,items,def){const on=getTab(key,def||items[0]);return `<div class="tabs">${items.map(x=>`<div class="tab ${x===on?'on':''}" onclick="setTab('${key}','${x}')">${x}</div>`).join('')}</div>`}
function head(t,d,a=''){return `<div class="pagehead"><div><h1>${t}</h1><p>${d}</p></div><div class="actions">${a}</div></div>`}
function metric(l,v,f,c='blue',i='•'){return `<div class="card metric"><div><div class="mlabel">${l}</div><div class="mvalue">${v}</div><div class="mfoot">${f}</div></div><div class="micon ${c}">${i}</div></div>`}
function tag(s){s=String(s);let c=(s.includes('通过')||s.includes('正常')||s.includes('完成')||s.includes('有效')||s.includes('结清')||s.includes('已放款')||s.includes('可信')||s.includes('无冲突')||s.includes('一致')||s.includes('成功'))?'tgreen':(s.includes('风险')||s.includes('逾期')||s.includes('红色')||s.includes('驳回')||s.includes('异常'))?'tred':(s.includes('待')||s.includes('审核')||s.includes('中')||s.includes('黄色')||s.includes('橙色')||s.includes('核查'))?'torange':(s.includes('冻结')||s.includes('质押'))?'tpurple':'tblue';return `<span class="tag ${c}">${s}</span>`}
function toolbar(ph='请输入编号、企业名称或关键词',extra=''){return `<div class="toolbar"><div class="search"><input oninput="filterRows(this.value)" placeholder="${ph}"></div><select class="filter"><option>全部状态</option><option>待处理</option><option>处理中</option><option>已完成</option><option>存在风险</option></select><select class="filter"><option>全部类型</option><option>订单融资</option><option>在途融资</option><option>仓单质押</option></select><button class="btn" onclick="filterRows(document.querySelector('.search input').value)">查询</button><button class="btn" onclick="resetFilter()">重置</button><span style="flex:1"></span>${extra}</div>`}
function table(cols,rows,id='tbody'){return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="${id}">${rows.join('')}</tbody></table></div>`}
function pager(n){return `<div class="pager"><span>共 ${n} 条记录，每页 10 条</span><span class="pg"><button>‹</button><button class="on">1</button><button>2</button><button>›</button></span></div>`}
function act(type,i,second='办理'){return `<div class="action-group"><button class="btn link" onclick="detail('${type}',${i})">详情</button><button class="btn link" onclick="openBusinessAction('${type}',${i},'${second}')">${second}</button></div>`}
function tr(cells,search=''){return `<tr data-s="${search||cells.map(x=>String(x).replace(/<[^>]+>/g,'')).join(' ')}">${cells.map(x=>`<td>${x}</td>`).join('')}</tr>`}
function steps(arr,active){return `<div class="process">${arr.map((x,i)=>`<div class="step ${i<active?'done':i===active?'active':''}"><div class="circle">${i<active?'✓':i+1}</div><div class="sname">${x}</div></div>`).join('')}</div>`}
function details(arr){return arr.map(x=>`<div class="di"><div class="dl">${x[0]}</div><div class="dv">${x[1]}</div></div>`).join('')}
function sectionTitle(t,s=''){return `<div class="chead"><div><div class="ctitle">${t}</div>${s?`<div class="csub">${s}</div>`:''}</div></div>`}
function progressBar(v){return `<div class="progress"><span style="width:${v}%"></span></div>`}

function openModal(type){
  if(type==='verifyCreate'){openVerifyModal('create');return;}
  if(type==='help'){
    document.querySelector('#modalMask .modal').classList.add('wide');
    document.getElementById('modalTitle').textContent='页面操作说明';
    document.getElementById('modalBody').innerHTML=`<div class="notice">本原型覆盖31个二级页面，所有核心业务均按照“申请/创建—数据校验—审批办理—结果生效—审计留痕”组织。</div><div class="quick">${listCard('详情抽屉','查看业务基础信息、流程进度、关联可信数据和操作记录。','适用于全部列表业务','可查看','1')}${listCard('办理弹窗','填写办理信息、审批结论、关联材料并流转到下一节点。','支持通过、退回、驳回和保存草稿','可操作','2')}${listCard('创建弹窗','按完整流程填写申请或配置，并生成业务编号和待办任务。','数据授权和材料完整性同步校验','可提交','3')}</div>`;
    document.getElementById('modalFoot').innerHTML='<button class="btn primary" onclick="closeModal()">知道了</button>';
    document.getElementById('modalMask').classList.add('show');return;
  }
  openCreateWorkflow(type);
}

function formByType(type){const title=(names[current]||'业务操作');if(type==='help')return ['功能说明','本原型按7个一级菜单、31个融合后的二级页面组织，验真任务已合并进交易验真，其他页面以页签承载完整业务流程。',[]];return [title,'请填写业务信息。提交后将形成待办任务并记录操作审计。',['业务名称',title,'业务状态','启用','责任人','当前用户']]}
function submit(t){closeModal();toast(t+'已提交')}
function closeModal(){document.getElementById('modalMask').classList.remove('show');document.querySelector('#modalMask .modal').classList.remove('wide','xwide')}
function closeDrawer(){document.getElementById('drawerMask').classList.remove('show')}
function maskClose(e,t){if(e.target===e.currentTarget)(t==='modal'?closeModal():closeDrawer())}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function refresh(){render();toast('页面数据已刷新')}
function render(){
  const pages={dashboard,todo_progress:todoProgress,verify_center:verifyCenter,verify_report:verifyReport,abnormal_rules:abnormalRules,enterprise_credit:enterpriseCredit,credit_apply:creditApply,credit_approve:creditApprove,credit_limit:creditLimit,credit_rules:creditRules,finance_products:financeProducts,finance_apply:financeApply,finance_approve:financeApprove,contract_disburse:contractDisburse,repayment_settlement:repaymentSettlement,finance_ledger:financeLedger,ownership_records:ownershipRecords,warehouse_receipt:warehouseReceipt,pledge_supervision:pledgeSupervision,valuation,ownership_abnormal:ownershipAbnormal,post_monitor:postMonitor,risk_center:riskCenter,post_report:postReport,maturity_reminder:maturityReminder,institutions_page:institutionsPage,product_config:productConfig,registration_platforms:registrationPlatforms,rules_config:rulesConfig,pricing_pledge:pricingPledge,agreements};
  document.getElementById('content').innerHTML=(pages[current]||dashboard)();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
function initApplication(){
  try{
    buildMenu();
    render();
  }catch(err){
    console.error('页面初始化失败：',err);
    const menu=document.getElementById('menu');
    const content=document.getElementById('content');
    if(menu) menu.innerHTML='<div style="padding:14px;color:#6f7890;font-size:13px">金融增值服务</div>';
    if(content) content.innerHTML='<div class="card" style="padding:24px"><h2 style="margin:0 0 10px">页面加载失败</h2><p style="color:#6f7890;line-height:1.8">请使用最新版 Chrome 或 Edge 打开本地 HTML 文件。错误信息：'+String(err.message||err)+'</p></div>';
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApplication,{once:true});
}else{
  initApplication();
}
