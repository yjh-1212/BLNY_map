      const updateSelection=()=>{const checked=$$('#view .row-check:checked').length,total=$$('#view .row-check').length,count=$('#view .batch-count'),all=$('#view .select-all');if(count)count.textContent=`已选 ${checked} 项`;if(all){all.checked=checked===total&&total>0;all.indeterminate=checked>0&&checked<total}};
      const selectAll=$('#view .select-all');if(selectAll)selectAll.addEventListener('change',()=>{$$('#view .row-check').forEach(x=>{if(x.closest('tr').style.display!=='none')x.checked=selectAll.checked});updateSelection()});
      $$('#view .row-check').forEach(x=>x.addEventListener('change',updateSelection));
    }
    const flipCoords=coords=>coords.map(p=>[p[1],p[0]]);
    function boundsOf(paths){const pts=paths.flat(),lats=pts.map(p=>p[0]),lngs=pts.map(p=>p[1]);return [[Math.min(...lngs)-1.6,Math.max(...lats)+1.5],[Math.max(...lngs)+1.6,Math.min(...lats)-1.5]]}
    function routeBounds(){return boundsOf(segments.map(s=>s.path||[[routeNodes[s.from].lat,routeNodes[s.from].lng],[routeNodes[s.to].lat,routeNodes[s.to].lng]]))}
    function nodeLabelPos(i){return ['top','left','top','left','right','bottom'][i]||'right'}
    function mapTooltip(){return {trigger:'item',backgroundColor:'rgba(255,255,255,.97)',borderColor:'#d4e0e8',borderWidth:1,padding:[8,11],textStyle:{color:'#33475a',fontSize:10}}}
    function chinaGeo(bounds){return {map:'china',roam:true,silent:true,boundingCoords:bounds,label:{show:false},itemStyle:{areaColor:'#edf2f7',borderColor:'#c3d3df',borderWidth:.7},emphasis:{disabled:true},select:{disabled:true}}}
    function mapUnavailable(el){el.innerHTML='<div style="padding:30px;color:#718198">地图组件加载失败，请联网后重新打开HTML。</div>'}
    function echartsMapReady(){return typeof echarts!=='undefined'&&echarts.getMap&&echarts.getMap('china')}
    function nodeSeries(nodes,palette){return {type:'scatter',coordinateSystem:'geo',z:6,symbolSize:11,
      itemStyle:{borderColor:'#fff',borderWidth:2,shadowBlur:6,shadowColor:'rgba(17,45,78,.28)'},
      label:{show:true,formatter:p=>`${p.data.icon} ${p.name}`,fontSize:10,fontWeight:700,color:'#33475a',backgroundColor:'rgba(255,255,255,.88)',borderColor:'#d4e0e8',borderWidth:1,borderRadius:4,padding:[3,6],distance:7},
      emphasis:{scale:1.3},
      tooltip:{formatter:p=>`<b>${p.name}</b><br>${p.data.nodeType}<br>${p.data.detail}`},
      data:nodes.map((n,i)=>({name:n.name,value:[n.lng,n.lat],nodeType:n.type,detail:n.detail,icon:n.icon,label:{position:nodeLabelPos(i)},itemStyle:{color:palette(n,i)}}))}}
    function initMap(id){
      const el=document.getElementById(id);if(!el)return;
      if(!echartsMapReady())return mapUnavailable(el);
      const chart=echarts.init(el);chartInstances.push(chart);mapInstance=chart;
      const doneCount=Math.max(1,Math.ceil(state.step/3));
      const lineData=segments.map((s,i)=>{const done=i<doneCount;return {name:s.name,coords:flipCoords(s.path||[[routeNodes[s.from].lat,routeNodes[s.from].lng],[routeNodes[s.to].lat,routeNodes[s.to].lng]]),distance:s.distance,routeNote:s.routeNote,lineStyle:{color:s.color,width:done?4.5:3,opacity:done?1:.42,type:done?'solid':'dashed',curveness:0},effect:done?{show:true,period:5.5,trailLength:.4,symbol:'arrow',symbolSize:6,color:s.color}:{show:false}}});
      const cur=routeNodes[demoSteps[state.step].loc];
      chart.setOption({
        textStyle:{fontFamily:'Microsoft YaHei'},
        tooltip:mapTooltip(),
        geo:chinaGeo(routeBounds()),
        series:[
          {type:'lines',coordinateSystem:'geo',polyline:true,z:5,symbol:['none','arrow'],symbolSize:7,
            emphasis:{lineStyle:{width:6}},
            tooltip:{formatter:p=>`<b>${p.name}</b><br>${p.data.distance}${p.data.routeNote?`<br>${p.data.routeNote}`:''}`},
            data:lineData},
          nodeSeries(routeNodes,(n,i)=>segments[Math.min(i,segments.length-1)].color),
          {type:'effectScatter',coordinateSystem:'geo',z:7,symbolSize:13,rippleEffect:{brushType:'stroke',scale:3.4},
            itemStyle:{color:'#cf4050',borderColor:'#fff',borderWidth:2,shadowBlur:8,shadowColor:'rgba(207,64,80,.5)'},
            label:{show:true,position:'top',formatter:'● 当前',fontSize:10,fontWeight:800,color:'#cf4050',distance:6},
            tooltip:{formatter:()=>`<b>当前业务位置</b><br>${cur.name}<br>${demoSteps[state.step].name}`},
            data:[{name:'当前业务位置',value:[cur.lng,cur.lat]}]}
        ]
      });
    }
    function initSolutionMap(){
      const el=document.getElementById('solutionMap');if(!el)return;
      if(!echartsMapReady())return mapUnavailable(el);
      const chart=echarts.init(el);chartInstances.push(chart);mapInstance=chart;
      const lineData=solutionPlans.map((p,i)=>{const sel=i===solutionState.selected;return {name:`方案${p.id} · ${p.name}`,coords:flipCoords(p.path),plan:p,lineStyle:{color:p.color,width:sel?5:2.5,opacity:sel?1:.45,type:sel?'solid':'dashed',curveness:0},effect:sel?{show:true,period:5.5,trailLength:.4,symbol:'arrow',symbolSize:6,color:p.color}:{show:false}}});
      const keyNodes=[...routeNodes,{name:'广州铁路场站',lat:23.13,lng:113.26,icon:'🚆',type:'铁公换装',detail:'方案C铁路到达节点'}];
      chart.setOption({
        textStyle:{fontFamily:'Microsoft YaHei'},
        tooltip:mapTooltip(),
        geo:chinaGeo(boundsOf(solutionPlans.map(p=>p.path))),
        series:[
          {type:'lines',coordinateSystem:'geo',polyline:true,z:5,symbol:['none','arrow'],symbolSize:7,
            tooltip:{formatter:p=>{const d=p.data.plan;return `<b>方案${d.id} · ${d.name}</b><br>${d.route}<br>¥${d.cost}/吨 · ${d.time}天 · 可靠性${d.reliability}%`}},
            data:lineData},
          nodeSeries(keyNodes,(n,i)=>i===0?'#159455':i===keyNodes.length-2?'#cf4050':'#1769e0')
        ]
      });
    }
    function mapFocus(mode){if(!mapInstance)return;const n=routeNodes[demoSteps[state.step].loc];mapInstance.setOption({geo:{boundingCoords:mode==='current'?[[n.lng-4.2,n.lat+3.1],[n.lng+4.2,n.lat-3.1]]:routeBounds()}})}
    function chart(id,opt){const el=document.getElementById(id);if(!el||typeof echarts==='undefined')return;const c=echarts.init(el);c.setOption({textStyle:{fontFamily:'Microsoft YaHei'},color:['#1769e0','#079da8','#159455','#7457d7','#c67a0a','#cf4050'],tooltip:{trigger:'axis'},...opt});chartInstances.push(c)}
    function afterRender(id){
      if(['demo','overview','joint-scheduling','quality-monitor','emergency','full-monitor','corridor'].includes(id)){const mapIds={demo:'demoMap',overview:'overviewMap','joint-scheduling':'scheduleMap','quality-monitor':'qualityMap',emergency:'emergencyMap','full-monitor':'monitorMap',corridor:'corridorMap'};initMap(mapIds[id])}
      if(id==='solution-center')initSolutionMap();
      if(id==='overview')chart('overviewChart',{legend:{data:['发运量','准点率'],bottom:0},grid:{left:42,right:38,top:24,bottom:45},xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日']},yAxis:[{type:'value',name:'万吨'},{type:'value',name:'%'}],series:[{name:'发运量',type:'bar',data:[10.8,12.6,11.9,15.2,13.8,17.4,16.1],barWidth:20},{name:'准点率',type:'line',yAxisIndex:1,data:[94,95,94.6,96,95.2,97,96.4],smooth:true}]});
      if(id==='solution-center'){const p=solutionPlans[solutionState.selected],impact=[[8.2,4.8,2.4,3.9,1.7],[9.6,3.8,0,4.1,2.2],[0,1.6,6.4,2.8,1.4]][solutionState.selected];chart('solutionPareto',{tooltip:{trigger:'item',formatter:x=>`方案${x.data[3]}<br>成本：¥${x.data[0]}/吨<br>时效：${x.data[1]}天<br>可靠性：${x.data[2]}%`},grid:{left:48,right:22,top:22,bottom:40},xAxis:{type:'value',name:'单吨成本（元）',min:410,max:480},yAxis:{type:'value',name:'时效（天）',min:5,max:8,inverse:true},series:[{type:'scatter',symbolSize:x=>18+(x[2]-85)*1.2,data:solutionPlans.map(x=>({value:[x.cost,x.time,x.reliability,x.id],itemStyle:{color:x.color},label:{show:true,position:'top',formatter:`方案${x.id}`}}))}]});chart('solutionCost',{tooltip:{trigger:'item',formatter:'{b}<br>¥{c}万 · {d}%'},legend:{bottom:0,itemWidth:10,itemHeight:7,textStyle:{fontSize:8}},series:[{type:'pie',radius:['42%','68%'],center:['50%','43%'],data:['公路运输','铁路运输','海运干线','装卸与节点','保险及风险'].map((n,i)=>({name:n,value:p.costs[i]})),label:{fontSize:8,formatter:'{b}\\n{c}万'}}]});chart('solutionSensitivity',{grid:{left:86,right:28,top:15,bottom:25},xAxis:{type:'value',name:'总成本影响（万元）'},yAxis:{type:'category',data:['保险费率+20%','汇率波动±3%','铁路运价+5%','港口等待+3h','海运运价+10%']},series:[{type:'bar',data:impact.slice().reverse(),barWidth:15,label:{show:true,position:'right',formatter:x=>'+'+x.value+'万'},itemStyle:{color:x=>x.dataIndex===4?'#cf4050':'#1769e0',borderRadius:[0,5,5,0]}}]})}
      if(id==='joint-scheduling')chart('scheduleChart',{grid:{left:90,right:22,top:25,bottom:30},xAxis:{type:'value',min:0,max:72,axisLabel:{formatter:v=>'+'+v+'h'}},yAxis:{type:'category',data:['装船离港','港口换装','铁路干线','公路短驳','粮库出库']},series:[{type:'bar',stack:'t',data:[48,30,12,4,0],itemStyle:{color:'transparent'}},{type:'bar',stack:'t',data:[12,12,18,8,5],itemStyle:{borderRadius:4},label:{show:true,position:'inside',formatter:p=>['装船作业','港口卸车','班列运输','车辆集运','备货装车'][p.dataIndex]}}]});
      if(id==='quality-monitor')chart('qualityChart',{legend:{data:['温度℃','湿度%'],bottom:0},grid:{left:42,right:25,top:25,bottom:42},xAxis:{type:'category',data:['08:00','10:00','12:00','14:00','16:00','18:00']},yAxis:[{type:'value'},{type:'value'}],series:[{name:'温度℃',type:'line',smooth:true,data:[20.6,21.2,21.8,22.1,21.7,21.4]},{name:'湿度%',type:'line',yAxisIndex:1,smooth:true,data:[65,66,67,69,68,67]}]});
      if(id==='loss-analysis'){chart('lossBar',{grid:{left:42,right:20,top:25,bottom:30},xAxis:{type:'category',data:['装车','公路','铁路','港口','海运']},yAxis:{type:'value',axisLabel:{formatter:'{value}%'}},series:[{type:'bar',data:[.08,.12,.09,.21,.16],barWidth:28}]});chart('lossPie',{tooltip:{trigger:'item'},legend:{bottom:0},series:[{type:'pie',radius:['42%','68%'],data:[{name:'装卸撒漏',value:36},{name:'水分变化',value:26},{name:'计量差异',value:20},{name:'其他异常',value:18}],label:{formatter:'{b}\\n{d}%'}}]})}
      if(id==='costs'){chart('costBar',{grid:{left:48,right:20,top:25,bottom:35},xAxis:{type:'category',data:['公铁水','公路+海运','铁路+海运','全程公路']},yAxis:{type:'value',axisLabel:{formatter:'¥{value}'}},series:[{type:'bar',data:[442,484,463,588],barWidth:30,label:{show:true,position:'top'}}]});chart('costPie',{tooltip:{trigger:'item'},legend:{bottom:0},series:[{type:'pie',radius:['42%','68%'],data:[{name:'公路',value:17.4},{name:'铁路',value:33.6},{name:'海运',value:50.4},{name:'港口装卸',value:23.1},{name:'保险预留',value:8.1}]}]})}
      if(id==='full-monitor')chart('etaChart',{grid:{left:90,right:22,top:25,bottom:25},xAxis:{type:'value',axisLabel:{formatter:'{value}h'}},yAxis:{type:'category',data:['到货签收','东莞到港','营口离港','铁路到港','公路到站']},series:[{type:'bar',data:[159,151,62,44,12],barWidth:15,label:{show:true,position:'right',formatter:p=>'+'+p.value+'h'}}]});
      if(id==='corridor')chart('corridorChart',{grid:{left:120,right:30,top:20,bottom:25},xAxis:{type:'value',max:100},yAxis:{type:'category',data:['齐齐哈尔—厦门','佳木斯—南宁','哈尔滨—广州','松原—泉州','绥化—东莞']},series:[{type:'bar',data:[87,89.6,91.2,93.4,96.2],barWidth:18,label:{show:true,position:'right'}}]});
      if(id==='analytics'){chart('analyticsTrend',{legend:{data:['运输量','单吨成本'],bottom:0},grid:{left:48,right:46,top:28,bottom:45},xAxis:{type:'category',data:['1月','2月','3月','4月','5月','6月','7月']},yAxis:[{type:'value',name:'万吨'},{type:'value',name:'元/吨'}],series:[{name:'运输量',type:'bar',data:[68,72,75,81,85,88,92.6]},{name:'单吨成本',type:'line',yAxisIndex:1,smooth:true,data:[468,462,458,451,446,442,438]}]});chart('analyticsRadar',{radar:{indicator:['时效','成本','准点','资源','安全','减损'].map(n=>({name:n,max:100}))},series:[{type:'radar',areaStyle:{opacity:.18},data:[{value:[94.2,90.8,95.8,91.6,96.2,95.4],name:'本月'}]}],tooltip:{trigger:'item'}})}
      if(id==='route-index')chart('indexChart',{grid:{left:120,right:30,top:25,bottom:30},xAxis:{type:'value',max:100},yAxis:{type:'category',data:['齐齐哈尔—厦门','佳木斯—南宁','哈尔滨—广州','松原—泉州','绥化—东莞']},series:[{type:'bar',data:[87,89.6,91.2,93.4,96.2],barWidth:20,label:{show:true,position:'right'},itemStyle:{color:p=>['#c67a0a','#7457d7','#079da8','#159455','#1769e0'][p.dataIndex]}}]});
    }
    $$('.nav-group').forEach(x=>x.addEventListener('click',()=>x.classList.toggle('open')));$$('[data-view]').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.view)));$('#modalClose').addEventListener('click',closeModal);$('#modalCancel').addEventListener('click',closeModal);$('#modalConfirm').addEventListener('click',()=>{const fn=pendingModal;if(typeof fn==='function')fn();else{closeModal();toast('操作已提交')}});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('show'))closeModal()});$('#mobileBtn').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#mask').classList.add('show')});$('#mask').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mask').classList.remove('show')});window.addEventListener('resize',()=>{chartInstances.forEach(c=>c.resize())});navigate('demo');
  </script>
