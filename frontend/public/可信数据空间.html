function bindSystemDetailModal(){
 const root=document.getElementById('modalBody');
 root.querySelectorAll('.business-tab').forEach(tab=>tab.addEventListener('click',()=>{
  const group=tab.dataset.tabGroup,target=tab.dataset.tabTarget;
  root.querySelectorAll(`.business-tab[data-tab-group="${group}"]`).forEach(x=>x.classList.toggle('active',x===tab));
  root.querySelectorAll(`[data-tab-panel^="${group}:"]`).forEach(x=>x.classList.toggle('active',x.dataset.tabPanel===`${group}:${target}`));
 }));
 root.querySelectorAll('.switch').forEach(sw=>sw.addEventListener('click',()=>{
  sw.classList.toggle('on');
  toast('接入范围已更新',sw.classList.contains('on')?'该权限开关已启用。':'该权限开关已关闭。','warn');
 }));
}

function openSystemAccessDetail(index=0,activeTab='basic'){
 const record=systemAccessRecords[Number(index)]||systemAccessRecords[0];
 const modal=document.querySelector('#modalMask .modal');
 modal.classList.add('system-detail-modal');
 document.querySelector('#modalMask .modal-foot').style.display='none';
 document.getElementById('modalTitle').textContent='接入系统详情';
 document.getElementById('modalBody').innerHTML=systemAccessDetailMarkup(record,activeTab);
 document.getElementById('modalMask').classList.add('show');
 bindSystemDetailModal();
}

function renderField(f){let ctrl='';const opts=(f.opts||'').split('|').filter(Boolean);if(f.type==='select')ctrl=`<select>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;else if(f.type==='textarea')ctrl=`<textarea placeholder="请输入${f.label}"></textarea>`;else if(f.type==='checkbox')ctrl=`<div class="check-grid">${opts.map(o=>`<label class="check-item"><input type="checkbox" />${o}</label>`).join('')}</div>`;else if(f.type==='file')ctrl=`<input type="file" />`;else ctrl=`<input type="${f.type==='date'?'date':'text'}" placeholder="请输入${f.label}" />`;return `<div class="field ${f.full?'full':''}"><label>${f.label}<em>*</em></label>${ctrl}${f.help?`<small>${f.help}</small>`:''}</div>`}
function openModal(kind='generic',titleOverride=''){const schema=formSchemas[kind]||formSchemas.generic;const modal=document.querySelector('#modalMask .modal');modal.classList.remove('system-detail-modal');document.querySelector('#modalMask .modal-foot').style.display='flex';document.getElementById('modalTitle').textContent=titleOverride||schema.title;document.getElementById('modalBody').innerHTML=`<div class="form-grid">${schema.sections.map(s=>`<div class="form-section">${icon('settings','sm')}${s[0]}</div>${s[1].map(renderField).join('')}`).join('')}</div>`;document.getElementById('modalSubmit').dataset.kind=kind;document.getElementById('modalMask').classList.add('show')}
function closeModal(){document.getElementById('modalMask').classList.remove('show');const modal=document.querySelector('#modalMask .modal');modal.classList.remove('system-detail-modal');document.querySelector('#modalMask .modal-foot').style.display='flex'}
function openDrawer(title='详情'){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=`<div class="detail-hero"><div><h3>${title}</h3><p>联邦对象详情 · 最近更新 2026-07-29 10:18</p></div>${statusTag('运行正常','green')}</div><div class="tabs drawer-tabs"><button class="tab active">基础信息</button><button class="tab">能力与范围</button><button class="tab">授权策略</button><button class="tab">运行监控</button><button class="tab">审计记录</button></div><div class="drawer-panel"><div class="detail-grid">${[['对象编号','FED-2026-00842'],['所属主体','北粮南运通道运营中心'],['对象类型','联邦服务对象'],['可信等级','A级'],['数据保管','提供方私域节点'],['使用控制','PDP + PEP'],['认证状态','mTLS已认证'],['最后活动','2分钟前']].map(x=>`<div class="detail-item"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card"><div class="card-head"><div class="card-title">${icon('audit')}最近活动</div></div><div class="card-body"><div class="timeline">${[['10:18','完成一次授权联合查询','依据数字合约 DC-2026-00067，返回16个字段。'],['09:42','策略版本更新','PEP已下发字段脱敏规则 V1.6。'],['08:35','连接器一致性检查通过','Schema、签名、幂等与重放测试全部通过。'],['昨天','生成使用凭证','凭证摘要已进入可选审计锚定队列。']].map(x=>`<div class="time-item"><div class="time-dot">${x[0].slice(0,2)}</div><div class="time-copy"><b>${x[1]}</b><span>${x[0]} · ${x[2]}</span></div></div>`).join('')}</div></div></div></div>`;document.getElementById('drawerMask').classList.add('show')}
function closeDrawer(){document.getElementById('drawerMask').classList.remove('show')}
function toast(title,msg,type='success'){const el=document.createElement('div');el.className=`toast ${type==='error'?'error':type==='warn'?'warn':''}`;el.innerHTML=`<span>${icon(type==='error'?'alert':type==='warn'?'clock':'check')}</span><div><b>${title}</b><span>${msg}</span></div>`;document.getElementById('toastWrap').appendChild(el);setTimeout(()=>el.remove(),3600)}
function renderNav(filter=''){
 const q=filter.trim().toLowerCase();document.getElementById('navTree').innerHTML=modules.map((m,mi)=>{const pages=m.pages.filter(x=>!q||x[1].toLowerCase().includes(q)||m.title.toLowerCase().includes(q));if(!pages.length)return'';if(m.pages.length===1){const x=m.pages[0];return `<div class="nav-group"><button class="nav-parent nav-direct" data-route="${x[0]}">${icon(m.icon,'sm')}<span>${m.title}</span></button></div>`}return `<div class="nav-group"><button class="nav-parent ${q?'open':''}" data-module="${m.id}">${icon(m.icon,'sm')}<span>${m.title}</span><span class="chev">›</span></button><div class="subnav"><div>${pages.map(x=>`<button class="nav-item" data-route="${x[0]}">${x[1]}</button>`).join('')}</div></div></div>`}).join('');
}
function syncRouteChrome(id){const p=pageMap[id]||pageMap.overview;document.getElementById('breadcrumb').textContent=p.module===p.title?p.title:`${p.module} / ${p.title}`;document.title=`${p.title} · 北粮南运可信数据空间`;document.getElementById('sidebar').classList.remove('show')}
function publishRoute(id){if(window.blnyBusinessUI?.canHandleRoute?.(id))syncRouteChrome(id);else renderPage(id);window.dispatchEvent(new CustomEvent('blny:viewchange',{detail:id}))}
function navigate(id,replace=false){if(!pageMap[id])id='overview';const hash=`#${id}`;if(replace){history.replaceState(null,'',hash);publishRoute(id)}else if(location.hash!==hash){location.hash=id}else{publishRoute(id)}}
function renderPage(id){const p=pageMap[id]||pageMap.overview;document.getElementById('breadcrumb').textContent=p.module===p.title?p.title:`${p.module} / ${p.title}`;document.title=`${p.title} · 北粮南运可信数据空间`;document.querySelectorAll('.nav-item,.nav-direct').forEach(n=>n.classList.toggle('active',n.dataset.route===id));document.querySelectorAll('.nav-group').forEach(g=>{const a=g.querySelector(`.nav-item[data-route="${id}"]`);if(a)g.querySelector('.nav-parent').classList.add('open')});const renderer=specialRender[p.id]||specialRender[id]||genericPage;document.getElementById('content').innerHTML=renderer(p);document.getElementById('content').scrollTop=0;document.getElementById('sidebar').classList.remove('show');bindDynamic();}
function bindDynamic(){document.querySelectorAll('.table-search').forEach(inp=>inp.addEventListener('input',e=>{const q=e.target.value.toLowerCase();const panel=e.target.closest('.tab-panel')||e.target.closest('.content');const table=panel?.querySelector('table');if(table)table.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}));document.querySelectorAll('.switch').forEach(sw=>sw.addEventListener('click',()=>{sw.classList.toggle('on');toast('策略已更新',sw.classList.contains('on')?'规则已启用并等待下发。':'规则已停用，新的请求将不再引用。','warn')}));document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{tab.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active')}));document.querySelectorAll('.business-tab').forEach(tab=>tab.addEventListener('click',()=>{const group=tab.dataset.tabGroup;const target=tab.dataset.tabTarget;document.querySelectorAll(`.business-tab[data-tab-group="${group}"]`).forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll(`[data-tab-panel^="${group}:"]`).forEach(x=>x.classList.toggle('active',x.dataset.tabPanel===`${group}:${target}`));}));}
function exportCurrent(){const rows=[...document.querySelectorAll('table tr')].map(tr=>[...tr.children].map(x=>`"${x.innerText.replace(/"/g,'""')}"`).join(','));if(!rows.length){toast('报告已生成','已生成当前页面的模拟分析报告。');return}const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${document.getElementById('breadcrumb').textContent.replace(/[ /]/g,'_')}.csv`;a.click();URL.revokeObjectURL(a.href);toast('导出成功','当前列表已导出为CSV文件。')}
function runQuerySimulation(){const steps=[...document.querySelectorAll('#queryPipeline .pipe-step')];if(!steps.length)return;steps.forEach(s=>s.classList.remove('running','done'));const st=document.getElementById('queryStatus');if(st){st.textContent='执行中';st.className='tag amber'};steps.forEach((s,i)=>setTimeout(()=>{if(i>0)steps[i-1].classList.remove('running'),steps[i-1].classList.add('done');s.classList.add('running');if(i===steps.length-1)setTimeout(()=>{s.classList.remove('running');s.classList.add('done');if(st){st.textContent='查询成功 · 760条';st.className='tag green'}toast('联合查询完成','命中5个节点，4个成功返回，字段由42项投影为16项。')},650)},i*650))}

function runConversionSimulation(){
 const items=[...document.querySelectorAll('#conversionValidation .validation-item')];
 const status=document.getElementById('conversionTestStatus');
 if(!items.length)return;
 items.forEach((it,i)=>{it.classList.remove('passed','failed');it.classList.add('testing');const tag=it.querySelector('.tag');if(tag){tag.textContent='测试中';tag.className='tag amber'}const progress=it.querySelector('.test-progress');if(progress)progress.classList.add('running');setTimeout(()=>{it.classList.remove('testing');it.classList.add('passed');if(tag){tag.textContent='通过';tag.className='tag green'}},700+i*280)});
 if(status){status.textContent='正在执行 8 项检查';status.className='tag amber'}
 setTimeout(()=>{if(status){status.textContent=`测试通过 · ${items.length}/${items.length}`;status.className='tag green'}toast('EPCIS转换测试通过','样例已通过画像、标识、代码、单位时区、敏感字段、签名、幂等和更正链检查。')},Math.max(1900,800+items.length*280))
}
function selectConversionRule(card){
 document.querySelectorAll('.rule-card').forEach(x=>x.classList.remove('active'));card.classList.add('active');
 const title=card.querySelector('b')?.textContent||'转换规则';

 toast('转换规则已切换',`正在编辑“${title}”。`)
}

function renderCommand(q=''){const all=modules.flatMap(m=>m.pages.map(([id,title])=>({id,title,module:m.title})));const rs=all.filter(x=>!q||`${x.title}${x.module}`.toLowerCase().includes(q.toLowerCase())).slice(0,16);document.getElementById('commandResults').innerHTML=rs.map((x,i)=>`<div class="command-item ${i===0?'active':''}" data-route="${x.id}"><div><b>${x.title}</b><span style="display:block;margin-top:3px">${x.module}</span></div><span>Enter ↵</span></div>`).join('')||`<div class="empty"><b>未找到功能页面</b><span>尝试输入“系统接入”“使用申请”“事件订阅”或“数字合约”。</span></div>`}

 const route=e.target.closest('[data-route]');if(route){e.preventDefault();navigate(route.dataset.route);document.getElementById('commandMask').classList.remove('show');document.getElementById('noticePop').classList.remove('show');return}

 toast('操作已受理',`${act.dataset.label||'当前操作'}已进入处理队列。`)
});
